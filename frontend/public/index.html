<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="image/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>QuizSystem</title>
  </head>
  <body>
    <!-- Clickjacking / iframe: HTTP headers (see Netlify _headers + API server) block loading in many browsers.
         This runs when the document still loads inside a frame (fallback). -->
    <script>
      (function () {
        if (window.top === window.self) return;
        try {
          window.top.location.replace(window.self.location.href);
        } catch (err) {
          document.documentElement.innerHTML =
            '<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Embedding blocked</title>' +
            '<style>html,body{height:100%;margin:0;background:#160808;color:#e8c878;font-family:system-ui,-apple-system,sans-serif}' +
            '.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center}' +
            'h1{font-size:1.05rem;font-weight:700;color:#f5e6c8;margin:0 0 .65rem}' +
            'p{font-size:.875rem;line-height:1.55;color:rgba(232,200,120,.55);max-width:26rem;margin:0}' +
            '</style></head><body><div class="wrap"><div><h1>This page cannot be displayed inside another website</h1>' +
            '<p>Embedding was blocked for your security. Open this app directly in the browser address bar instead.</p></div></div></body>';
        }
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
